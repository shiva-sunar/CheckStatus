name: Lumbini Driving License Slot Checker

on:
  # Allows triggering via external cron (e.g., cron-job.org)
  repository_dispatch:
    types: [check-slots]

  # Allows manual triggering anytime from GitHub UI (Actions tab -> Run workflow)
  workflow_dispatch:

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Slot Check
        env:
          EDL_UUID: ${{ secrets.EDL_UUID || '92a75ad3-4a1a-4ae3-8f10-5435eac485e4' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TYPE: 'TRIAL'
          DAYS_AHEAD: '30'
          NOTIFY_ON_EMPTY: ${{ vars.NOTIFY_ON_EMPTY || 'false' }}
        run: |
          python check_slot.py
